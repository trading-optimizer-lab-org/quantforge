name: Aurora Future Run v3

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Repository-relative version-3 run spec
        required: true
        type: string
      workload:
        description: Aurora workload reference, aurora.module:OBJECT
        required: true
        type: string
      run_label:
        description: Stable artifact prefix
        required: true
        type: string
      retention_days:
        description: Retention for intermediate and final artifacts
        required: false
        default: 7
        type: number
      execution_mode:
        description: Optimized weighted plan or equivalent baseline
        required: false
        default: optimized
        type: string
      forced_job_count:
        description: Exact baseline job count; zero lets the planner decide
        required: false
        default: 0
        type: number
      prepared_artifact_name:
        description: Existing immutable prepared-input artifact to reuse
        required: false
        default: ""
        type: string
      prepared_artifact_run_id:
        description: Source run containing the prepared-input artifact
        required: false
        default: ""
        type: string
      wheelhouse_artifact_name:
        description: Existing immutable wheelhouse artifact to reuse
        required: false
        default: ""
        type: string
      performance_profile_run_id:
        description: Prior compatible run containing a performance profile
        required: false
        default: ""
        type: string
      performance_profile_artifact_name:
        description: Artifact containing performance_profile.json
        required: false
        default: ""
        type: string
      fault_injection_shard_id:
        description: Test-only initial shard to fail after a valid checkpoint
        required: false
        default: ""
        type: string
      fault_injection_after_units:
        description: Test-only exact checkpoint boundary; zero disables it
        required: false
        default: 0
        type: number
      autonomous_batch_id:
        description: Deterministic autonomous-discovery batch identifier
        required: false
        default: 0
        type: number
      autonomous_candidate_count:
        description: Pre-registered candidate count for an autonomous batch
        required: false
        default: 96
        type: number
      autonomous_previous_trial_count:
        description: Monotonic count of all candidates tested before this batch
        required: false
        default: 312
        type: number
      autonomous_prior_ledger_artifact_name:
        description: Prior batch results artifact carrying the cumulative trial ledger
        required: false
        default: ""
        type: string
      autonomous_prior_ledger_run_id:
        description: Run containing the prior cumulative trial ledger artifact
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      spec_path:
        description: Repository-relative version-3 run spec
        required: true
        type: string
      workload:
        description: Aurora workload reference, aurora.module:OBJECT
        required: true
        type: string
      run_label:
        description: Stable artifact prefix
        required: true
        type: string
      retention_days:
        description: Retention for intermediate and final artifacts
        required: false
        default: 7
        type: number
      execution_mode:
        description: Optimized weighted plan or equivalent baseline
        required: false
        default: optimized
        type: string
      forced_job_count:
        description: Exact baseline job count; zero lets the planner decide
        required: false
        default: 0
        type: number
      prepared_artifact_name:
        description: Existing immutable prepared-input artifact to reuse
        required: false
        default: ""
        type: string
      prepared_artifact_run_id:
        description: Source run containing the prepared-input artifact
        required: false
        default: ""
        type: string
      wheelhouse_artifact_name:
        description: Existing immutable wheelhouse artifact to reuse
        required: false
        default: ""
        type: string
      performance_profile_run_id:
        description: Prior compatible run containing a performance profile
        required: false
        default: ""
        type: string
      performance_profile_artifact_name:
        description: Artifact containing performance_profile.json
        required: false
        default: ""
        type: string
      fault_injection_shard_id:
        description: Test-only initial shard to fail after a valid checkpoint
        required: false
        default: ""
        type: string
      fault_injection_after_units:
        description: Test-only exact checkpoint boundary; zero disables it
        required: false
        default: 0
        type: number
      autonomous_batch_id:
        description: Deterministic autonomous-discovery batch identifier
        required: false
        default: 0
        type: number
      autonomous_candidate_count:
        description: Pre-registered candidate count for an autonomous batch
        required: false
        default: 96
        type: number
      autonomous_previous_trial_count:
        description: Monotonic count of all candidates tested before this batch
        required: false
        default: 312
        type: number
      autonomous_prior_ledger_artifact_name:
        description: Prior batch results artifact carrying the cumulative trial ledger
        required: false
        default: ""
        type: string
      autonomous_prior_ledger_run_id:
        description: Run containing the prior cumulative trial ledger artifact
        required: false
        default: ""
        type: string
    outputs:
      selected_jobs:
        description: Exact standard-runner shard count selected by the plan
        value: ${{ jobs.conclude.outputs.selected_jobs }}
      profile_reused:
        description: Whether planning reused an exact compatible profile
        value: ${{ jobs.conclude.outputs.profile_reused }}
      verification_passed:
        description: Whether the reusable workflow published a verified result
        value: ${{ jobs.conclude.outputs.verification_passed }}

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  AURORA_AUTONOMOUS_BATCH_ID: ${{ inputs.autonomous_batch_id }}
  AURORA_AUTONOMOUS_CANDIDATE_COUNT: ${{ inputs.autonomous_candidate_count }}
  AURORA_AUTONOMOUS_PREVIOUS_TRIAL_COUNT: ${{ inputs.autonomous_previous_trial_count }}
  AURORA_PREPARED_ARTIFACT_NAME: ${{ inputs.prepared_artifact_name != '' && contains(inputs.workload, 'sp500_autonomous_discovery') && format('{0}-refreshed-prepared-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) || inputs.prepared_artifact_name || format('{0}-prepared-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}
  AURORA_PREPARED_ARTIFACT_RUN_ID: ${{ inputs.prepared_artifact_name != '' && contains(inputs.workload, 'sp500_autonomous_discovery') && github.run_id || inputs.prepared_artifact_run_id || github.run_id }}
  AURORA_WHEELHOUSE_ARTIFACT_NAME: ${{ inputs.wheelhouse_artifact_name || format('{0}-wheelhouse-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}

jobs:
  validate:
    needs: prepare_environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        id: runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Validate requested contract
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          aurora github validate \
            --spec "$SPEC_PATH" \
            --output-dir "$RUNNER_TEMP/preflight"
          python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.github_performance.preflight import load_github_yaml

          payload = load_github_yaml(Path(os.environ["SPEC_PATH"]))
          supplied = str(payload["identity"]["code_sha"])
          observed = os.environ["TRIGGER_SHA"]
          if supplied not in ("", observed):
              raise SystemExit(
                  "CODE_SHA_MISMATCH: spec does not match triggering commit"
              )
          PY
      - name: Upload preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Upload immutable environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: environment_manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  prepare_environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      wheelhouse_sha256: ${{ steps.identity.outputs.wheelhouse_sha256 }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download shared immutable wheelhouse
        if: inputs.wheelhouse_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Set up build Python
        if: inputs.wheelhouse_artifact_name == ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Build immutable wheelhouse once
        if: inputs.wheelhouse_artifact_name == ''
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/build_github_performance_wheelhouse.py build \
            --requirements-lock requirements/github-performance.lock \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --code-sha "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch"
      - name: Read wheelhouse identity
        id: identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "wheelhouse"
               / "wheelhouse_manifest.json").read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(
                  f"wheelhouse_sha256={manifest['wheelhouse_sha256']}\n"
              )
          PY
      - name: Upload immutable wheelhouse
        if: inputs.wheelhouse_artifact_name == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  sp500_data_plan:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      window_count: ${{ steps.plan.outputs.window_count }}
      requested_start: ${{ steps.plan.outputs.requested_start }}
      requested_end: ${{ steps.plan.outputs.requested_end }}
    steps:
      - name: Plan bounded SPY reconciliation windows
        id: plan
        env:
          WORKLOAD: ${{ inputs.workload }}
          PREPARED_ARTIFACT_NAME: ${{ inputs.prepared_artifact_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os

          workload = os.environ["WORKLOAD"]
          enabled = (
              (
                  "sp500_long_short_daily" in workload
                  or "sp500_autonomous_discovery" in workload
              )
              and not os.environ["PREPARED_ARTIFACT_NAME"]
          )
          if "SMOKE_WORKLOAD" in workload:
              start, end = dt.date(2005, 10, 1), dt.date(2009, 9, 30)
          else:
              start, end = dt.date(1993, 1, 22), dt.date(2010, 12, 31)

          windows = []
          if enabled:
              cursor = start
              while cursor <= end:
                  try:
                      next_window = cursor.replace(year=cursor.year + 3)
                  except ValueError:
                      next_window = cursor.replace(year=cursor.year + 3, day=28)
                  bounded_end = min(next_window - dt.timedelta(days=1), end)
                  index = len(windows)
                  windows.append(
                      {
                          "window_id": f"{index:03d}",
                          "start": cursor.isoformat(),
                          "end": bounded_end.isoformat(),
                      }
                  )
                  cursor = bounded_end + dt.timedelta(days=1)
          else:
              windows.append(
                  {"window_id": "disabled", "start": start.isoformat(), "end": end.isoformat()}
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"enabled={str(enabled).lower()}\n")
              handle.write(f"matrix={json.dumps({'include': windows}, separators=(',', ':'))}\n")
              handle.write(f"window_count={len(windows) if enabled else 0}\n")
              handle.write(f"requested_start={start.isoformat()}\n")
              handle.write(f"requested_end={end.isoformat()}\n")
          PY

  sp500_stooq_windows:
    needs: [prepare_environment, sp500_data_plan]
    if: needs.sp500_data_plan.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.sp500_data_plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download prior autonomous trial ledger
        if: inputs.autonomous_prior_ledger_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.autonomous_prior_ledger_artifact_name }}
          path: ${{ runner.temp }}/prior-ledger
          github-token: ${{ github.token }}
          run-id: ${{ inputs.autonomous_prior_ledger_run_id }}
      - name: Download bounded raw Stooq window
        run: |
          set -euo pipefail
          python scripts/download_sp500_stooq_window.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --split train \
            --window-id "${{ matrix.window_id }}" \
            --source-mode "yahoo-fallback" \
            --output-dir "$RUNNER_TEMP/stooq-window"
      - name: Upload immutable Stooq window
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-stooq-${{ github.run_id }}-${{ matrix.window_id }}
          path: ${{ runner.temp }}/stooq-window
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  sp500_prepare_data:
    needs: [validate, prepare_environment, sp500_data_plan, sp500_stooq_windows]
    if: needs.sp500_data_plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download prior autonomous trial ledger
        if: inputs.autonomous_prior_ledger_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.autonomous_prior_ledger_artifact_name }}
          path: ${{ runner.temp }}/prior-ledger
          github-token: ${{ github.token }}
          run-id: ${{ inputs.autonomous_prior_ledger_run_id }}
      - name: Download every Stooq window
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.run_label }}-stooq-${{ github.run_id }}-*
          path: ${{ runner.temp }}/stooq-windows
      - name: Download canonical V1 and V2 multiplicity evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-ls-v2-train-results
          path: ${{ runner.temp }}/historical-multiplicity
          github-token: ${{ github.token }}
          run-id: "31007105419"
      - name: Download canonical autonomous pilot evidence
        if: inputs.autonomous_previous_trial_count > 312
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-auto-pilot-b0-results
          path: ${{ runner.temp }}/autonomous-pilot
          github-token: ${{ github.token }}
          run-id: "31036879593"
      - name: Merge and verify Stooq windows
        run: |
          set -euo pipefail
          python scripts/merge_sp500_stooq_windows.py \
            --input-root "$RUNNER_TEMP/stooq-windows" \
            --output-dir "$RUNNER_TEMP/stooq-merged" \
            --expected-windows "${{ needs.sp500_data_plan.outputs.window_count }}" \
            --requested-start "${{ needs.sp500_data_plan.outputs.requested_start }}" \
            --requested-end "${{ needs.sp500_data_plan.outputs.requested_end }}"
      - name: Prepare immutable SPY data
        env:
          SP500_STOOQ_HISTORY_CSV: ${{ runner.temp }}/stooq-merged/stooq_spy_us_history.csv
          SP500_STOOQ_HISTORY_MANIFEST: ${{ runner.temp }}/stooq-merged/stooq_sharded_manifest.json
          SPEC_PATH: ${{ inputs.spec_path }}
          WORKLOAD: ${{ inputs.workload }}
          AURORA_PRIOR_TRIAL_LEDGER_PATH: ${{ runner.temp }}/prior-ledger/trial_ledger.jsonl
          AURORA_HISTORICAL_MULTIPLICITY_SOURCE: ${{ runner.temp }}/historical-multiplicity
          AURORA_AUTONOMOUS_PILOT_EVIDENCE_ROOT: ${{ runner.temp }}/autonomous-pilot
        run: |
          set -euo pipefail
          aurora github prepare \
            --spec "$SPEC_PATH" \
            --workload "$WORKLOAD" \
            --output-dir "$RUNNER_TEMP/prepared"
      - name: Upload immutable prepared inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  prepare_data:
    needs: [validate, sp500_data_plan, sp500_prepare_data]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.sp500_data_plan.outputs.enabled != 'true' ||
        needs.sp500_prepare_data.result == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: ./.github/actions/download-artifact-retry
        with:
          artifact-name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          output-dir: ${{ runner.temp }}/wheelhouse
          attempts: "6"
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download prior autonomous trial ledger
        if: inputs.autonomous_prior_ledger_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.autonomous_prior_ledger_artifact_name }}
          path: ${{ runner.temp }}/prior-ledger
          github-token: ${{ github.token }}
          run-id: ${{ inputs.autonomous_prior_ledger_run_id }}
      - name: Download shared immutable inputs
        if: inputs.prepared_artifact_name != '' || needs.sp500_data_plan.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.prepared_artifact_name || env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepared_artifact_run_id || github.run_id }}
      - name: Refresh autonomous batch inputs on reused market data
        if: inputs.prepared_artifact_name != '' && contains(inputs.workload, 'sp500_autonomous_discovery')
        env:
          AURORA_PRIOR_TRIAL_LEDGER_PATH: ${{ runner.temp }}/prior-ledger/trial_ledger.jsonl
        run: |
          set -euo pipefail
          python scripts/refresh_sp500_autonomous_prepared.py \
            --prepared-root "$RUNNER_TEMP/prepared"
      - name: Upload refreshed autonomous prepared inputs
        if: inputs.prepared_artifact_name != '' && contains(inputs.workload, 'sp500_autonomous_discovery')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
      - name: Prepare immutable data once
        if: inputs.prepared_artifact_name == '' && needs.sp500_data_plan.outputs.enabled != 'true'
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          WORKLOAD: ${{ inputs.workload }}
          AURORA_PRIOR_TRIAL_LEDGER_PATH: ${{ runner.temp }}/prior-ledger/trial_ledger.jsonl
        run: |
          set -euo pipefail
          aurora github prepare \
            --spec "$SPEC_PATH" \
            --workload "$WORKLOAD" \
            --output-dir "$RUNNER_TEMP/prepared"
      - name: Upload prepared inputs
        if: inputs.prepared_artifact_name == '' && needs.sp500_data_plan.outputs.enabled != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  freeze_contract:
    needs: [validate, prepare_environment, prepare_data]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.prepare_environment.result == 'success' &&
      needs.prepare_data.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: ${{ env.AURORA_PREPARED_ARTIFACT_RUN_ID }}
      - name: Freeze resolved scientific and performance contract
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail
          metric_contract="$(
            python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.github_performance.preflight import load_github_yaml
          print(load_github_yaml(Path(os.environ["SPEC_PATH"]))["metrics"]["contract_path"])
          PY
          )"
          aurora github freeze-contract \
            --spec "$SPEC_PATH" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --environment-manifest "$RUNNER_TEMP/environment/environment_manifest.json" \
            --workflow ".github/workflows/_aurora-future-run-v3.yml" \
            --metric-contract "$metric_contract" \
            --capacity-profile "config/github_capacity_profile.json" \
            --code-sha "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/contract"
      - name: Upload frozen contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  smoke:
    needs: freeze_contract
    if: always() && needs.freeze_contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: ${{ env.AURORA_PREPARED_ARTIFACT_RUN_ID }}
      - name: Run bounded smoke
        env:
          WORKLOAD: ${{ inputs.workload }}
          AURORA_PREPARED_ROOT: ${{ runner.temp }}/prepared
        run: |
          set -euo pipefail
          aurora github smoke \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --output "$RUNNER_TEMP/smoke/smoke_result.json"
      - name: Upload smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  pilot:
    needs: smoke
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: ${{ env.AURORA_PREPARED_ARTIFACT_RUN_ID }}
      - name: Download prior immutable performance profile
        if: >-
          inputs.performance_profile_run_id != '' &&
          inputs.performance_profile_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.performance_profile_artifact_name }}
          path: ${{ runner.temp }}/performance-profile
          github-token: ${{ github.token }}
          run-id: ${{ inputs.performance_profile_run_id }}
      - name: Resolve exact profile or measure fresh pilot
        env:
          WORKLOAD: ${{ inputs.workload }}
          AURORA_PREPARED_ROOT: ${{ runner.temp }}/prepared
        run: |
          set -euo pipefail
          profile_args=()
          if [[ -d "$RUNNER_TEMP/performance-profile" ]]; then
            mapfile -t profiles < <(
              find "$RUNNER_TEMP/performance-profile" \
                -type f -name performance_profile.json -print
            )
            if [[ "${#profiles[@]}" -ne 1 ]]; then
              echo "Expected exactly one performance_profile.json" >&2
              exit 2
            fi
            profile_args=(
              --performance-profile "${profiles[0]}"
            )
          fi
          aurora github resolve-pilot \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --contract "$RUNNER_TEMP/contract/performance_contract.json" \
            "${profile_args[@]}" \
            --output "$RUNNER_TEMP/pilot/performance_pilot.json" \
            --resolution-output \
              "$RUNNER_TEMP/pilot/planning_pilot_resolution.json"
      - name: Upload pilot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  plan:
    needs: pilot
    if: always() && needs.pilot.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix_a: ${{ steps.outputs.outputs.matrix_a }}
      matrix_b: ${{ steps.outputs.outputs.matrix_b }}
      has_matrix_b: ${{ steps.outputs.outputs.has_matrix_b }}
      merge_matrix: ${{ steps.outputs.outputs.merge_matrix }}
      merge_level_0_matrix: ${{ steps.outputs.outputs.merge_level_0_matrix }}
      merge_level_0_count: ${{ steps.outputs.outputs.merge_level_0_count }}
      merge_level_1_matrix: ${{ steps.outputs.outputs.merge_level_1_matrix }}
      merge_level_1_count: ${{ steps.outputs.outputs.merge_level_1_count }}
      merge_level_2_matrix: ${{ steps.outputs.outputs.merge_level_2_matrix }}
      merge_level_2_count: ${{ steps.outputs.outputs.merge_level_2_count }}
      merge_level_3_matrix: ${{ steps.outputs.outputs.merge_level_3_matrix }}
      merge_level_3_count: ${{ steps.outputs.outputs.merge_level_3_count }}
      merge_root_artifact: ${{ steps.outputs.outputs.merge_root_artifact }}
      merge_root_level: ${{ steps.outputs.outputs.merge_root_level }}
      selected_jobs: ${{ steps.outputs.outputs.selected_jobs }}
      profile_reused: ${{ steps.profile.outputs.profile_reused }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: ${{ env.AURORA_PREPARED_ARTIFACT_RUN_ID }}
      - name: Download pilot evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot
      - name: Expose pilot provenance
        id: profile
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "pilot"
                  / "planning_pilot_resolution.json"
              ).read_text(encoding="utf-8")
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(
                  "profile_reused="
                  + str(bool(payload["profile_reused"])).lower()
                  + "\n"
              )
          PY
      - name: Build adaptive balanced plan
        env:
          WORKLOAD: ${{ inputs.workload }}
          AURORA_PREPARED_ROOT: ${{ runner.temp }}/prepared
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          FORCED_JOB_COUNT: ${{ inputs.forced_job_count }}
          ARTIFACT_PREFIX: ${{ inputs.run_label }}
        run: |
          set -euo pipefail
          aurora github plan \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --pilot "$RUNNER_TEMP/pilot/performance_pilot.json" \
            --pilot-resolution \
              "$RUNNER_TEMP/pilot/planning_pilot_resolution.json" \
            --execution-mode "$EXECUTION_MODE" \
            --forced-job-count "$FORCED_JOB_COUNT" \
            --artifact-prefix "$ARTIFACT_PREFIX" \
            --output-dir "$RUNNER_TEMP/plan"
      - name: Emit compact GitHub matrices
        id: outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("plan", "plan_outputs.json")
              .read_text(encoding="utf-8")
          )
          names = {
              "matrix_a": "matrix_a_json",
              "matrix_b": "matrix_b_json",
              "has_matrix_b": "has_matrix_b",
              "merge_matrix": "merge_matrix_json",
              "merge_level_0_matrix": "merge_level_0_matrix_json",
              "merge_level_0_count": "merge_level_0_count",
              "merge_level_1_matrix": "merge_level_1_matrix_json",
              "merge_level_1_count": "merge_level_1_count",
              "merge_level_2_matrix": "merge_level_2_matrix_json",
              "merge_level_2_count": "merge_level_2_count",
              "merge_level_3_matrix": "merge_level_3_matrix_json",
              "merge_level_3_count": "merge_level_3_count",
              "merge_root_artifact": "merge_root_artifact",
              "merge_root_level": "merge_root_level",
              "selected_jobs": "selected_jobs",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for output, source in names.items():
                  out.write(f"{output}={payload[source]}\n")
          PY
      - name: Upload immutable execution plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  fanout_a:
    needs: plan
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps:
      - name: Checkout exact revision
