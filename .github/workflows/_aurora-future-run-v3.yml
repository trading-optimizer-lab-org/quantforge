        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: ${{ env.AURORA_PREPARED_ARTIFACT_RUN_ID }}
      - name: Download assignment plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Materialize shard descriptor
        env:
          SHARD_JSON: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          descriptor = json.loads(os.environ["SHARD_JSON"])
          plan = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("plan", "balanced_shard_plan.json")
              .read_text(encoding="utf-8")
          )
          payload = next(
              shard
              for shard in plan["shards"]
              if shard["shard_id"] == descriptor["shard_id"]
          )
          for key in (
              "merge_group",
              "assignment_artifact",
              "assignment_member",
              "assignment_sha256",
          ):
              if payload[key] != descriptor[key]:
                  raise SystemExit(f"SHARD_DESCRIPTOR_MISMATCH: {key}")
          Path(os.environ["RUNNER_TEMP"]).joinpath("shard.json").write_text(
              json.dumps(payload, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Execute shard
        env:
          WORKLOAD: ${{ inputs.workload }}
          ARTIFACT_NAME: ${{ inputs.run_label }}-shard-${{ matrix.merge_group }}-${{ matrix.shard_id }}-${{ matrix.attempt_id }}
          AURORA_FAULT_INJECTION_SHARD_ID: ${{ inputs.fault_injection_shard_id }}
          AURORA_FAULT_INJECTION_AFTER_UNITS: ${{ inputs.fault_injection_after_units }}
        run: |
          set -euo pipefail
          aurora github run-shard \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --shard "$RUNNER_TEMP/shard.json" \
            --attempt-id "${{ matrix.attempt_id }}" \
            --artifact-name "$ARTIFACT_NAME" \
            --assignment-root "$RUNNER_TEMP/plan" \
            --prepared-root "$RUNNER_TEMP/prepared" \
            --output-dir "$RUNNER_TEMP/attempt/${{ matrix.shard_id }}/${{ matrix.attempt_id }}" \
            --defer-technical-failure-to-recovery
      - name: Salvage attempt evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-shard-${{ matrix.merge_group }}-${{ matrix.shard_id }}-${{ matrix.attempt_id }}
          path: ${{ runner.temp }}/attempt
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
      - name: Detect valid checkpoint
        if: always()
        id: checkpoint
        run: |
          set -euo pipefail
          checkpoint="$(
            find "$RUNNER_TEMP/attempt" \
              -name checkpoint_manifest.json -type f -print -quit \
              2>/dev/null || true
          )"
          if [[ -n "$checkpoint" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Salvage valid checkpoint
        if: always() && steps.checkpoint.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: run-checkpoint-${{ matrix.shard_id }}-${{ matrix.attempt_id }}
          path: ${{ runner.temp }}/attempt/**/checkpoint*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  fanout_b:
