name: SP500 Autonomous Discovery

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Campaign phase
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - research
          - data_build
          - pilot
          - search_batch
          - merge_batch
          - statistical_gate
          - freeze
          - validation_once
          - exploratory_validation
          - verify
      batch_id:
        description: Deterministic autonomous batch identifier
        required: false
        default: 0
        type: number
      candidate_count:
        description: Pre-registered candidates in a train batch
        required: false
        default: 96
        type: number
      prior_trial_count:
        description: Monotonic candidates tested before this batch
        required: false
        default: 312
        type: number
      prior_trial_ledger_run_id:
        description: Previous train run containing the cumulative trial ledger
        required: false
        default: ""
        type: string
      prior_trial_ledger_artifact:
        description: Previous results artifact containing trial_ledger.jsonl
        required: false
        default: ""
        type: string
      execution_mode:
        description: Universal planner mode
        required: false
        default: optimized
        type: choice
        options:
          - optimized
          - baseline
      forced_job_count:
        description: Zero lets the measured planner choose
        required: false
        default: 0
        type: number
      validation_ack:
        description: Exact one-shot validation authorization
        required: false
        default: ""
        type: string
      train_run_id:
        description: Verified train run containing frozen artifacts
        required: false
        default: ""
        type: string
      train_results_artifact:
        description: Frozen train results artifact
        required: false
        default: ""
        type: string
      train_prepared_artifact:
        description: Frozen train prepared-input artifact
        required: false
        default: ""
        type: string
      exploratory_strategy_id:
        description: Exact train candidate for owner-authorized exploratory validation
        required: false
        default: ""
        type: string
      validation_stooq_run_id:
        description: Prior verified run containing bounded validation Stooq windows
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  AURORA_TRAIN_END: "2010-12-31"
  AURORA_VALIDATION_START: "2011-01-01"
  AURORA_VALIDATION_END: "2020-12-31"
  AURORA_LOCKED_START: "2021-01-01"

jobs:
  preflight:
    if: inputs.phase == 'preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Run fail-closed preflight
        run: |
          set -euo pipefail
          python scripts/preflight_sp500_autonomous_discovery.py \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/preflight"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight
          if-no-files-found: error
          retention-days: 90

  pilot:
    if: inputs.phase == 'pilot'
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/sp500_autonomous_discovery.yaml
      workload: aurora.infra.sp500_autonomous_discovery.workload:PILOT_WORKLOAD
      run_label: sp500-auto-pilot-b${{ inputs.batch_id }}
      retention_days: 30
      execution_mode: ${{ inputs.execution_mode }}
      forced_job_count: ${{ inputs.forced_job_count }}
      autonomous_batch_id: ${{ inputs.batch_id }}
      autonomous_candidate_count: 24
      autonomous_previous_trial_count: ${{ inputs.prior_trial_count }}
      autonomous_prior_ledger_run_id: ${{ inputs.prior_trial_ledger_run_id }}
      autonomous_prior_ledger_artifact_name: ${{ inputs.prior_trial_ledger_artifact }}
    secrets: inherit

  research:
    if: inputs.phase == 'research'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Freeze research registry inventory
        env:
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from aurora.infra.sp500_autonomous_discovery.registry import base_package

          package = base_package()
          root = Path(os.environ["RUNNER_TEMP_VALUE"]) / "research"
          root.mkdir(parents=True, exist_ok=True)
          payload = {
              "campaign_id": "sp500-autonomous-discovery",
              "research_rows": len(package.research),
              "feature_rows": len(package.features),
              "dataset_rows": len(package.datasets),
              "candidate_templates": len(package.candidates),
              "source_zip_sha256": hashlib.sha256(package.zip_path.read_bytes()).hexdigest(),
              "selection_binding": False,
          }
          (root / "research_inventory.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload research inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-research-${{ github.run_id }}
          path: ${{ runner.temp }}/research
          if-no-files-found: error
          retention-days: 90

  data_build:
    if: inputs.phase == 'data_build'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate bounded data contract
        run: |
          set -euo pipefail
          test "$AURORA_TRAIN_END" = "2010-12-31"
          test "$AURORA_VALIDATION_END" = "2020-12-31"
          test "$AURORA_LOCKED_START" = "2021-01-01"
          mkdir -p "$RUNNER_TEMP/data-build"
          printf '{"train_end":"%s","validation_end":"%s","locked_start":"%s","locked_opened":false}\n' "$AURORA_TRAIN_END" "$AURORA_VALIDATION_END" "$AURORA_LOCKED_START" > "$RUNNER_TEMP/data-build/data_contract.json"
      - name: Upload data contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-data-build-${{ github.run_id }}
          path: ${{ runner.temp }}/data-build
          if-no-files-found: error
          retention-days: 90

  train_batch:
    if: inputs.phase == 'search_batch' && inputs.batch_id != 1000
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/sp500_autonomous_discovery.yaml
      workload: aurora.infra.sp500_autonomous_discovery.workload:TRAIN_WORKLOAD
      run_label: sp500-auto-batch-${{ inputs.batch_id }}
      retention_days: 90
      execution_mode: ${{ inputs.execution_mode }}
      forced_job_count: ${{ inputs.forced_job_count }}
      autonomous_batch_id: ${{ inputs.batch_id }}
      autonomous_candidate_count: ${{ inputs.candidate_count }}
      autonomous_previous_trial_count: ${{ inputs.prior_trial_count }}
      autonomous_prior_ledger_run_id: ${{ inputs.prior_trial_ledger_run_id }}
      autonomous_prior_ledger_artifact_name: ${{ inputs.prior_trial_ledger_artifact }}
    secrets: inherit

  continue_or_freeze:
    needs: train_batch
    if: inputs.phase == 'search_batch' && inputs.batch_id != 1000 && needs.train_batch.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download verified batch result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sp500-auto-batch-${{ inputs.batch_id }}-results" \
            --dir "$RUNNER_TEMP/batch"
      - name: Continue search or open validation exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_ID: ${{ inputs.batch_id }}
          CANDIDATE_COUNT: ${{ inputs.candidate_count }}
          PRIOR_TRIAL_COUNT: ${{ inputs.prior_trial_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "batch" / "autonomous_batch_summary.json")
              .read_text(encoding="utf-8")
          )
          finalists = int(summary.get("eligible_finalists", 0))
          batch_id = int(os.environ["BATCH_ID"])
          if finalists:
              next_inputs = {
                  "phase": "validation_once",
                  "batch_id": str(batch_id),
                  "candidate_count": os.environ["CANDIDATE_COUNT"],
                  "prior_trial_count": str(summary["global_trial_count"]),
                  "execution_mode": "optimized",
                  "forced_job_count": "0",
                  "validation_ack": "OPEN_VALIDATION_2011_2020_ONCE_AUTONOMOUS",
                  "train_run_id": os.environ["GITHUB_RUN_ID"],
                  "train_results_artifact": f"sp500-auto-batch-{batch_id}-results",
                  "train_prepared_artifact": f"sp500-auto-batch-{batch_id}-prepared-{os.environ['GITHUB_RUN_ID']}",
              }
          else:
              next_inputs = {
                  "phase": "search_batch",
                  "batch_id": str(batch_id + 1),
                  "candidate_count": os.environ["CANDIDATE_COUNT"],
                  "prior_trial_count": str(summary["global_trial_count"]),
                  "execution_mode": "optimized",
                  "forced_job_count": "0",
                  "prior_trial_ledger_run_id": os.environ["GITHUB_RUN_ID"],
                  "prior_trial_ledger_artifact": f"sp500-auto-batch-{batch_id}-results",
              }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(json.dumps({"batch_summary": summary, "next_inputs": next_inputs}, indent=2))
          with open(Path(os.environ["RUNNER_TEMP"]) / "next_inputs.json", "w", encoding="utf-8") as handle:
              json.dump(next_inputs, handle, indent=2, sort_keys=True)
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          inputs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "next_inputs.json").read_text(encoding="utf-8"))
          payload = {"ref": os.environ["GITHUB_REF_NAME"], "inputs": inputs}
          (Path(os.environ["RUNNER_TEMP"]) / "dispatch.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/sp500-autonomous-discovery.yml/dispatches" \
            --input "$RUNNER_TEMP/dispatch.json"
      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-controller-${{ github.run_id }}
          path: ${{ runner.temp }}/next_inputs.json
          if-no-files-found: error
          retention-days: 90

  massive_prepare:
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact massive-search revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Download verified batch 51 inputs, results, and wheelhouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31181579135 --repo "$GITHUB_REPOSITORY" \
            --name "sp500-auto-batch-51-refreshed-prepared-31181579135-1" \
            --dir "$RUNNER_TEMP/source-prepared"
          gh run download 31181579135 --repo "$GITHUB_REPOSITORY" \
            --name "sp500-auto-batch-51-results" \
            --dir "$RUNNER_TEMP/prior-results"
          gh run download 31181579135 --repo "$GITHUB_REPOSITORY" \
            --name "sp500-auto-batch-51-wheelhouse-31181579135-1" \
            --dir "$RUNNER_TEMP/wheelhouse"
      - name: Build one relocatable locked runtime
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$RUNNER_TEMP/wheelhouse" \
            --require-hashes \
            --target "$RUNNER_TEMP/runtime-site" \
            -r requirements/github-performance.lock
      - name: Prepare compact train input and prior multiplicity evidence
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/..:$RUNNER_TEMP/runtime-site"
          python scripts/prepare_sp500_massive_train.py \
            --source-prepared-root "$RUNNER_TEMP/source-prepared" \
            --prior-results-root "$RUNNER_TEMP/prior-results" \
            --prior-output-dir "$RUNNER_TEMP/prior" \
            --output-dir "$RUNNER_TEMP/input"
          python scripts/prepare_sp500_massive_prior_statistics.py \
            --prior-root "$RUNNER_TEMP/prior" \
            --prepared-root "$RUNNER_TEMP/input" \
            --output-dir "$RUNNER_TEMP/prior/statistics" \
            --workers 4
      - name: Upload compact runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-massive-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-site
          if-no-files-found: error
          retention-days: 7
      - name: Upload compact train-only input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-massive-train-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/input
          if-no-files-found: error
          retention-days: 7
      - name: Upload prior multiplicity accumulators
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-massive-prior-${{ github.run_id }}
          path: ${{ runner.temp }}/prior
          if-no-files-found: error
          retention-days: 7

  massive_wave_0:
    needs: massive_prepare
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_prepare.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 0
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_wave_1:
    needs: massive_wave_0
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_0.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 1
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_wave_2:
    needs: massive_wave_1
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_1.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 2
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_wave_3:
    needs: massive_wave_2
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_2.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 3
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_wave_4:
    needs: massive_wave_3
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_3.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 4
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_wave_5:
    needs: massive_wave_4
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_4.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 5
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_wave_6:
    needs: massive_wave_5
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_5.result == 'success'
    uses: ./.github/workflows/_sp500-massive-train-wave.yml
    with:
      wave: 6
      input_artifact_name: sp500-massive-train-inputs-${{ github.run_id }}
      runtime_artifact_name: sp500-massive-runtime-${{ github.run_id }}
      minutes_per_shard: 50
      max_candidates_per_worker: 0
    secrets: inherit

  massive_final_merge:
    needs: massive_wave_6
    if: inputs.phase == 'search_batch' && inputs.batch_id == 1000 && needs.massive_wave_6.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Download runtime, seven waves, and prior multiplicity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sp500-massive-runtime-$GITHUB_RUN_ID" \
            --dir "$RUNNER_TEMP/runtime"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sp500-massive-prior-$GITHUB_RUN_ID" \
            --dir "$RUNNER_TEMP/all/prior"
          for wave in $(seq 0 6); do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "sp500-massive-wave-$wave-results" \
              --dir "$RUNNER_TEMP/all/wave-$wave"
          done
      - name: Merge and apply frozen train gates
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/..:$RUNNER_TEMP/runtime"
          python scripts/merge_sp500_massive_train.py \
            --mode final \
            --input-root "$RUNNER_TEMP/all" \
            --prior-root "$RUNNER_TEMP/all/prior" \
            --output-dir "$RUNNER_TEMP/final" \
            --retain-top 50000
      - name: Verify no validation or locked access
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads((Path(os.environ["RUNNER_TEMP"]) / "final" / "summary.json").read_text())
          assert summary["train_end"] == "2010-12-31"
          assert summary["validation_opened"] is False
          assert summary["locked_start"] == "2021-01-01"
          assert summary["locked_opened"] is False
          assert summary["github_only"] is True
          assert summary["requires_local_machine"] is False
          PY
      - name: Upload final train-only result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-massive-train-night-results
          path: ${{ runner.temp }}/final
          if-no-files-found: error
          retention-days: 90
      - name: Delete consumed massive-search artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name != "sp500-massive-train-night-results" and (.name | startswith("sp500-massive-"))) | .id' |
          while read -r artifact_id; do
            [[ -z "$artifact_id" ]] || gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

  verify_train_artifact:
    if: contains(fromJSON('["merge_batch","statistical_gate","freeze","verify"]'), inputs.phase)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a completed train artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RUN_ID: ${{ inputs.train_run_id }}
          TRAIN_RESULTS_ARTIFACT: ${{ inputs.train_results_artifact }}
        run: |
          set -euo pipefail
          [[ "$TRAIN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -n "$TRAIN_RESULTS_ARTIFACT" ]]
          gh run download "$TRAIN_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$TRAIN_RESULTS_ARTIFACT" --dir "$RUNNER_TEMP/train"
      - name: Verify selected control phase
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "train"
          summary = json.loads((root / "autonomous_batch_summary.json").read_text(encoding="utf-8"))
          if summary["locked_opened"] is not False or summary["validation_used_for_selection"] is not False:
              raise SystemExit("TRAIN_CONTROL_BOUNDARY_BREACH")
          if int(summary["total_strategies_loaded"]) < int(summary["total_strategies_evaluated"]):
              raise SystemExit("TRAIN_RECONCILIATION_BREACH")
          print(json.dumps({"phase": os.environ["PHASE"], "summary": summary}, sort_keys=True))
          PY

  validation_once:
    if: inputs.phase == 'validation_once'
    concurrency:
      group: sp500-autonomous-discovery-validation-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact frozen revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Reserve the single validation opening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$({
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "sp500-autonomous-validation-once" and .expired == false) | .id'
          })"
          if [[ -n "$existing" ]]; then
            echo "::error::VALIDATION_ALREADY_OPENED"
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/validation-reservation"
          printf '{"campaign_id":"sp500-autonomous-discovery","validation_start":"2011-01-01","validation_end":"2020-12-31","locked_opened":false,"run_id":"%s","commit_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/validation-reservation/reservation.json"
      - name: Publish one-shot reservation marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-validation-once
          path: ${{ runner.temp }}/validation-reservation/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify one-shot authorization
        env:
          VALIDATION_ACK: ${{ inputs.validation_ack }}
          TRAIN_RUN_ID: ${{ inputs.train_run_id }}
          TRAIN_RESULTS_ARTIFACT: ${{ inputs.train_results_artifact }}
          TRAIN_PREPARED_ARTIFACT: ${{ inputs.train_prepared_artifact }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_ACK" == "OPEN_VALIDATION_2011_2020_ONCE_AUTONOMOUS" ]]
          [[ "$TRAIN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -n "$TRAIN_RESULTS_ARTIFACT" && -n "$TRAIN_PREPARED_ARTIFACT" ]]
      - name: Download frozen train artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.train_run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.train_results_artifact }}" --dir "$RUNNER_TEMP/train-results"
          gh run download "${{ inputs.train_run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.train_prepared_artifact }}" --dir "$RUNNER_TEMP/train-prepared"
      - name: Prepare bounded validation data
        env:
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.sp500_autonomous_discovery.registry import base_package
          from aurora.infra.sp500_long_short_daily.data import prepare_market_snapshot

          prepare_market_snapshot(
              Path(os.environ["RUNNER_TEMP_VALUE"]) / "validation-prepared",
              base_package(),
              start="2011-01-01",
              end="2020-12-31",
              split="validation",
          )
          PY
      - name: Open validation once
        run: |
          set -euo pipefail
          python scripts/run_sp500_autonomous_validation.py \
            --train-results-dir "$RUNNER_TEMP/train-results" \
            --train-prepared-dir "$RUNNER_TEMP/train-prepared" \
            --validation-prepared-dir "$RUNNER_TEMP/validation-prepared" \
            --output-dir "$RUNNER_TEMP/validation-results" \
            --validation-ack "${{ inputs.validation_ack }}"
      - name: Check validation boundary
        env:
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["RUNNER_TEMP_VALUE"]) / "validation-results"
          summary = json.loads((root / "validation_summary.json").read_text(encoding="utf-8"))
          if summary["locked_opened"] is not False or summary["validation_used_for_selection"] is not False:
              raise SystemExit("VALIDATION_BOUNDARY_OR_SELECTION_BREACH")
          annual = pd.read_csv(root / "validation_annual_metrics.csv")
          if len(annual) and (annual["year"].min() < 2011 or annual["year"].max() > 2020):
              raise SystemExit("VALIDATION_YEAR_BREACH")
          PY
      - name: Upload one-shot validation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-validation-once-${{ github.run_id }}
          path: ${{ runner.temp }}/validation-results
          if-no-files-found: error
          retention-days: 90

  exploratory_validation:
    if: inputs.phase == 'exploratory_validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Verify explicit exploratory authorization
        env:
          VALIDATION_ACK: ${{ inputs.validation_ack }}
          TRAIN_RUN_ID: ${{ inputs.train_run_id }}
          TRAIN_RESULTS_ARTIFACT: ${{ inputs.train_results_artifact }}
          STRATEGY_ID: ${{ inputs.exploratory_strategy_id }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_ACK" == "OPEN_EXPLORATORY_VALIDATION_2011_2020_OWNER_AUTHORIZED" ]]
          [[ "$TRAIN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -n "$TRAIN_RESULTS_ARTIFACT" && -n "$STRATEGY_ID" ]]
      - name: Download exact train result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.train_run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.train_results_artifact }}" --dir "$RUNNER_TEMP/train-results"
      - name: Download reusable validation Stooq windows
        if: inputs.validation_stooq_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_STOOQ_RUN_ID: ${{ inputs.validation_stooq_run_id }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_STOOQ_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$VALIDATION_STOOQ_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "sp500-ls-stooq-window-${VALIDATION_STOOQ_RUN_ID}-*" \
            --dir "$RUNNER_TEMP/stooq-windows"
      - name: Merge reusable validation Stooq windows
        if: inputs.validation_stooq_run_id != ''
        run: |
          set -euo pipefail
          python scripts/merge_sp500_stooq_windows.py \
            --input-root "$RUNNER_TEMP/stooq-windows" \
            --output-dir "$RUNNER_TEMP/stooq-merged" \
            --expected-windows 82 \
            --requested-start 2011-01-01 \
            --requested-end 2020-12-31
      - name: Prepare bounded validation data
        env:
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
          VALIDATION_STOOQ_RUN_ID: ${{ inputs.validation_stooq_run_id }}
          STRATEGY_ID: ${{ inputs.exploratory_strategy_id }}
        run: |
          set -euo pipefail
          if [[ -n "$VALIDATION_STOOQ_RUN_ID" ]]; then
            export SP500_STOOQ_HISTORY_CSV="$RUNNER_TEMP/stooq-merged/stooq_spy_us_history.csv"
            export SP500_STOOQ_HISTORY_MANIFEST="$RUNNER_TEMP/stooq-merged/stooq_sharded_manifest.json"
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.sp500_autonomous_discovery.validation import exploratory_validation_package
          from aurora.infra.sp500_long_short_daily.data import prepare_market_snapshot

          root = Path(os.environ["RUNNER_TEMP_VALUE"])
          prepare_market_snapshot(
              root / "validation-prepared",
              exploratory_validation_package(root / "train-results", os.environ["STRATEGY_ID"]),
              start="2011-01-01",
              end="2020-12-31",
              split="validation",
          )
          PY
      - name: Evaluate exact candidate without opening locked
        run: |
          set -euo pipefail
          python scripts/run_sp500_autonomous_exploratory_validation.py \
            --train-results-dir "$RUNNER_TEMP/train-results" \
            --validation-prepared-dir "$RUNNER_TEMP/validation-prepared" \
            --output-dir "$RUNNER_TEMP/exploratory-validation-results" \
            --strategy-id "${{ inputs.exploratory_strategy_id }}" \
            --validation-ack "${{ inputs.validation_ack }}"
      - name: Verify validation and locked boundaries
        env:
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              (Path(os.environ["RUNNER_TEMP_VALUE"]) / "exploratory-validation-results" / "validation_summary.json")
              .read_text(encoding="utf-8")
          )
          assert summary["validation_end"] == "2020-12-31"
          assert summary["locked_start"] == "2021-01-01"
          assert summary["locked_opened"] is False
          assert summary["confirmatory_result"] is False
          assert summary["official_validation_reservation_created"] is False
          PY
      - name: Upload exploratory validation result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-autonomous-exploratory-validation-${{ inputs.exploratory_strategy_id }}
          path: ${{ runner.temp }}/exploratory-validation-results
          if-no-files-found: error
          retention-days: 90
